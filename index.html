<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>WAV FLAC - Audio Converter</title>
  <style>
    :root {
      --bg-color: #0d0e15;
      --card-bg: rgba(23, 25, 38, 0.75);
      --accent-pink: #ff2a85;
      --accent-purple: #8a2be2;
      --text-main: #f0f3f9;
      --text-muted: #9aa4bf;
      --border-color: rgba(255, 255, 255, 0.1);
      --card-inner-bg: rgba(13, 14, 21, 0.6);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }

    body {
      background-color: var(--bg-color);
      background-image: radial-gradient(circle at 50% 10%, rgba(138, 43, 226, 0.15), transparent 40%),
                        radial-gradient(circle at 80% 80%, rgba(255, 42, 133, 0.1), transparent 50%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }

    .container {
      width: 100%;
      max-width: 620px;
      background: var(--card-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-color);
      border-radius: 24px;
      padding: 32px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
    }

    h1 {
      text-align: center;
      font-size: 2.2rem;
      font-weight: 800;
      background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 24px;
      letter-spacing: -0.5px;
    }

    .drop-zone {
      position: relative;
      border: 2px dashed rgba(255, 42, 133, 0.4);
      border-radius: 16px;
      padding: 28px;
      text-align: center;
      cursor: pointer;
      transition: all 0.3s ease;
      background: rgba(255, 255, 255, 0.02);
      margin-bottom: 24px;
    }

    .drop-zone p {
      color: var(--text-muted);
      font-size: 0.95rem;
      pointer-events: none;
    }

    .drop-zone span {
      color: var(--text-main);
      font-weight: 600;
      display: block;
      margin-top: 6px;
      pointer-events: none;
    }

    .drop-zone input[type="file"] {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      opacity: 0;
      cursor: pointer;
    }

    .file-list {
      max-height: 160px;
      overflow-y: auto;
      margin-bottom: 20px;
      border: 1px solid var(--border-color);
      border-radius: 12px;
      background: var(--card-inner-bg);
      padding: 10px;
    }

    .file-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 8px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      font-size: 0.88rem;
    }

    .file-item:last-child {
      border-bottom: none;
    }

    .file-name {
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 80%;
    }

    .remove-file {
      color: var(--accent-pink);
      cursor: pointer;
      font-weight: bold;
      padding: 2px 6px;
    }

    .grid-settings {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 16px;
    }

    .section-title {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--text-muted);
      margin-bottom: 12px;
      font-weight: 700;
    }

    .form-group {
      margin-bottom: 20px;
    }

    select {
      width: 100%;
      padding: 12px 16px;
      border-radius: 12px;
      background: rgba(13, 14, 21, 0.8);
      border: 1px solid var(--border-color);
      color: var(--text-main);
      font-size: 0.95rem;
      outline: none;
      transition: border-color 0.3s ease;
      -webkit-appearance: none;
    }

    select:focus {
      border-color: var(--accent-purple);
    }

    .btn {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 12px;
      background: linear-gradient(135deg, var(--accent-pink), var(--accent-purple));
      color: white;
      font-size: 1rem;
      font-weight: 700;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(255, 42, 133, 0.3);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      margin-top: 10px;
    }

    .btn:hover {
      transform: translateY(-2px);
    }

    .btn:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .progress-bar-container {
      width: 100%;
      height: 8px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      overflow: hidden;
      margin-top: 16px;
      display: none;
    }

    .progress-bar {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent-pink), var(--accent-purple));
      transition: width 0.3s ease;
    }

    .status {
      margin-top: 12px;
      text-align: center;
      font-size: 0.9rem;
      color: var(--accent-pink);
      min-height: 20px;
    }

    @media (max-width: 480px) {
      .grid-settings {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>WAV FLAC APP 2</h1>

    <div class="drop-zone" id="dropZone">
      <p id="fileNameDisplay">Toca aquí para seleccionar archivos de audio</p>
      <span>o arrastra los archivos</span>
      <input type="file" id="audioInput" multiple />
    </div>

    <div class="file-list" id="fileList" style="display: none;"></div>

    <div class="grid-settings">
      <div class="form-group">
        <div class="section-title">Formato de Salida</div>
        <select id="formatSelect" onchange="toggleFlacOptions()">
          <option value="wav">WAV (PCM)</option>
          <option value="flac">FLAC (Lossless)</option>
        </select>
      </div>

      <div class="form-group">
        <div class="section-title">Frecuencia de Muestreo</div>
        <select id="sampleRateSelect">
          <option value="44100">44.1 kHz (44100 Hz)</option>
          <option value="48000">48.0 kHz (48000 Hz)</option>
        </select>
      </div>
    </div>

    <div class="grid-settings">
      <div class="form-group">
        <div class="section-title">Profundidad de Bits</div>
        <select id="bitDepthSelect">
          <option value="16">16 bits (CD Quality)</option>
          <option value="24">24 bits (Hi-Res)</option>
          <option value="32">32 bits flotantes (Solo WAV)</option>
        </select>
      </div>

      <div class="form-group">
        <div class="section-title">Algoritmo de Dither</div>
        <select id="ditherSelect">
          <option value="none">Sin Dither (None)</option>
          <option value="triangular">Triangular (TPDF)</option>
          <option value="rectangular">Rectangular (RPDF)</option>
        </select>
      </div>
    </div>

    <div class="form-group" id="flacCompressionGroup" style="display: none;">
      <div class="section-title">Nivel de Compresión FLAC</div>
      <select id="compressionSelect">
        <option value="0">0 (Rápido, menor compresión)</option>
        <option value="5" selected>5 (Recomendado)</option>
        <option value="8">8 (Máxima compresión)</option>
      </select>
    </div>

    <button class="btn" id="convertBtn" onclick="convertAudioBatch()">Convertir Archivos</button>
    
    <div class="progress-bar-container" id="progressContainer">
      <div class="progress-bar" id="progressBar"></div>
    </div>
    <div class="status" id="statusText"></div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/libflacjs@5.4.0/dist/libflac.min.js"></script>

  <script>
    let selectedFiles = [];
    let FlacEncoderModule = null;

    if (typeof Flac !== 'undefined') {
      Flac.on('ready', function(event) {
        FlacEncoderModule = event.target;
      });
    }

    const audioInput = document.getElementById('audioInput');
    const dropZone = document.getElementById('dropZone');
    const fileList = document.getElementById('fileList');
    const statusText = document.getElementById('statusText');
    const progressContainer = document.getElementById('progressContainer');
    const progressBar = document.getElementById('progressBar');

    audioInput.addEventListener('change', (e) => {
      if (e.target.files.length > 0) {
        addFiles(Array.from(e.target.files));
      }
    });

    function addFiles(files) {
      selectedFiles = [...selectedFiles, ...files];
      renderFileList();
    }

    function removeFile(index) {
      selectedFiles.splice(index, 1);
      renderFileList();
    }

    function renderFileList() {
      if (selectedFiles.length === 0) {
        fileList.style.display = 'none';
        return;
      }
      fileList.style.display = 'block';
      fileList.innerHTML = selectedFiles.map((file, i) => `
        <div class="file-item">
          <span class="file-name">${file.name}</span>
          <span class="remove-file" onclick="removeFile(${i})">&times;</span>
        </div>
      `).join('');
    }

    function toggleFlacOptions() {
      const format = document.getElementById('formatSelect').value;
      const compressionGroup = document.getElementById('flacCompressionGroup');
      compressionGroup.style.display = format === 'flac' ? 'block' : 'none';
    }

    function applyDither(sample, bitDepth, ditherType) {
      if (ditherType === 'none') return sample;
      let r1 = Math.random() - 0.5;
      let r2 = Math.random() - 0.5;
      let noise = ditherType === 'triangular' ? (r1 + r2) : r1;
      let lsb = 1 / Math.pow(2, bitDepth - 1);
      return Math.max(-1, Math.min(1, sample + noise * lsb));
    }

    async function convertAudioBatch() {
      if (selectedFiles.length === 0) {
        statusText.textContent = 'Selecciona al menos un archivo.';
        return;
      }

      const format = document.getElementById('formatSelect').value;
      const targetSampleRate = parseInt(document.getElementById('sampleRateSelect').value);
      let bitDepth = parseInt(document.getElementById('bitDepthSelect').value);
      const dither = document.getElementById('ditherSelect').value;
      const compressionLevel = parseInt(document.getElementById('compressionSelect').value);
      const convertBtn = document.getElementById('convertBtn');

      if (format === 'flac' && bitDepth === 32) {
        bitDepth = 24;
      }

      try {
        convertBtn.disabled = true;
        progressContainer.style.display = 'block';
        progressBar.style.width = '0%';

        if (format === 'flac' && (!FlacEncoderModule || !FlacEncoderModule.isReady())) {
          statusText.textContent = 'Cargando motor de compresión FLAC...';
          await new Promise(r => setTimeout(r, 1000));
          if (!FlacEncoderModule || !FlacEncoderModule.isReady()) {
            throw new Error('No se pudo inicializar el motor de compresión FLAC.');
          }
        }

        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        const total = selectedFiles.length;

        for (let i = 0; i < total; i++) {
          const file = selectedFiles[i];
          statusText.textContent = `Procesando (${i + 1}/${total}): ${file.name}`;

          const arrayBuffer = await file.arrayBuffer();
          const decodedAudio = await audioCtx.decodeAudioData(arrayBuffer);

          const offlineCtx = new OfflineAudioContext(
            decodedAudio.numberOfChannels,
            Math.ceil(decodedAudio.duration * targetSampleRate),
            targetSampleRate
          );

          const source = offlineCtx.createBufferSource();
          source.buffer = decodedAudio;
          source.connect(offlineCtx.destination);
          source.start(0);

          const resampledAudio = await offlineCtx.startRendering();

          let blob;
          if (format === 'wav') {
            blob = createWavBlob(resampledAudio, bitDepth, dither);
          } else {
            blob = await encodeFlacWithMetadata(resampledAudio, bitDepth, compressionLevel, dither);
          }

          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          const baseName = file.name.substring(0, file.name.lastIndexOf('.')) || file.name;
          a.download = `${baseName}_converted.${format}`;
          a.click();

          progressBar.style.width = `${Math.round(((i + 1) / total) * 100)}%`;
        }

        statusText.textContent = '¡Conversión completada con éxito!';
      } catch (err) {
        console.error(err);
        statusText.textContent = err.message || 'Error al procesar el archivo.';
      } finally {
        convertBtn.disabled = false;
      }
    }

    function createWavBlob(audioBuffer, bitDepth, dither) {
      const numChannels = audioBuffer.numberOfChannels;
      const sampleRate = audioBuffer.sampleRate;
      const numSamples = audioBuffer.length;
      const bytesPerSample = bitDepth / 8;
      const blockAlign = numChannels * bytesPerSample;
      const dataSize = numSamples * blockAlign;
      const buffer = new ArrayBuffer(44 + dataSize);
      const view = new DataView(buffer);

      function writeString(offset, string) {
        for (let i = 0; i < string.length; i++) {
          view.setUint8(offset + i, string.charCodeAt(i));
        }
      }

      writeString(0, 'RIFF');
      view.setUint32(4, 36 + dataSize, true);
      writeString(8, 'WAVE');
      writeString(12, 'fmt ');
      view.setUint32(16, 16, true);
      view.setUint16(20, bitDepth === 32 ? 3 : 1, true);
      view.setUint16(22, numChannels, true);
      view.setUint32(24, sampleRate, true);
      view.setUint32(28, sampleRate * blockAlign, true);
      view.setUint16(32, blockAlign, true);
      view.setUint16(34, bitDepth, true);
      writeString(36, 'data');
      view.setUint32(40, dataSize, true);

      let offset = 44;
      for (let i = 0; i < numSamples; i++) {
        for (let ch = 0; ch < numChannels; ch++) {
          let sample = audioBuffer.getChannelData(ch)[i];
          sample = applyDither(sample, bitDepth, dither);

          if (bitDepth === 16) {
            let s = Math.max(-1, Math.min(1, sample));
            view.setInt16(offset, s < 0 ? s * 0x8000 : s * 0x7FFF, true);
          } else if (bitDepth === 24) {
            let s = Math.max(-1, Math.min(1, sample));
            let val = Math.floor(s < 0 ? s * 0x800000 : s * 0x7FFFFF);
            view.setUint8(offset, val & 0xFF);
            view.setUint8(offset + 1, (val >> 8) & 0xFF);
            view.setUint8(offset + 2, (val >> 16) & 0xFF);
          } else if (bitDepth === 32) {
            view.setFloat32(offset, sample, true);
          }
          offset += bytesPerSample;
        }
      }

      return new Blob([buffer], { type: 'audio/wav' });
    }

        async function encodeFlacWithMetadata(audioBuffer, bitDepth, compressionLevel, dither) {
      return new Promise((resolve, reject) => {
        try {
          const channels = audioBuffer.numberOfChannels;
          const sampleRate = audioBuffer.sampleRate;
          const totalSamples = audioBuffer.length;

          const encoder = FlacEncoderModule.create_libflac_encoder(
            sampleRate,
            channels,
            bitDepth,
            compressionLevel,
            totalSamples,
            false,
            0
          );

          if (!encoder) {
            return reject(new Error('No se pudo inicializar el codificador.'));
          }

          const flacChunks = [];

          FlacEncoderModule.init_encoder_stream(
            encoder,
            function(data) {
              flacChunks.push(new Uint8Array(data));
            },
            null,
            null,
            null
          );

          const blockLength = 4096;
          const pcmBuff = new Int32Array(blockLength * channels);

          for (let i = 0; i < totalSamples; i += blockLength) {
            const currentBlockSize = Math.min(blockLength, totalSamples - i);
            let ptr = 0;

            for (let j = 0; j < currentBlockSize; j++) {
              for (let ch = 0; ch < channels; ch++) {
                let sample = audioBuffer.getChannelData(ch)[i + j];
                sample = applyDither(sample, bitDepth, dither);
                let s = Math.max(-1, Math.min(1, sample));

                if (bitDepth === 16) {
                  pcmBuff[ptr++] = Math.floor(s < 0 ? s * 0x8000 : s * 0x7FFF);
                } else {
                  pcmBuff[ptr++] = Math.floor(s < 0 ? s * 0x800000 : s * 0x7FFFFF);
                }
              }
            }

            // Pasa las muestras como un subarray directo en lugar de llamar a _malloc
            FlacEncoderModule.FLAC__stream_encoder_process_interleaved(
              encoder,
              pcmBuff.subarray(0, currentBlockSize * channels),
              currentBlockSize
            );
          }

          FlacEncoderModule.FLAC__stream_encoder_finish(encoder);
          FlacEncoderModule.FLAC__stream_encoder_delete(encoder);

          // Combinar bloques en un solo TypedArray
          let totalBytes = flacChunks.reduce((acc, chunk) => acc + chunk.length, 0);
          let merged = new Uint8Array(totalBytes);
          let offset = 0;
          for (let chunk of flacChunks) {
            merged.set(chunk, offset);
            offset += chunk.length;
          }

          // Corrección del bloque STREAMINFO inyectando la duración total
          if (merged.length > 26) {
            merged[21] = ((totalSamples >> 28) & 0x0F) | (merged[21] & 0xF0);
            merged[22] = (totalSamples >> 20) & 0xFF;
            merged[23] = (totalSamples >> 12) & 0xFF;
            merged[24] = (totalSamples >> 4) & 0xFF;
            merged[25] = ((totalSamples & 0x0F) << 4) | (merged[25] & 0x0F);
          }

          resolve(new Blob([merged], { type: 'audio/flac' }));
        } catch (e) {
          reject(e);
        }
      });
    }

  </script>
</body>
</html>
